<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Cotações - Tempo Real</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0e17;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-size: 32px; color: #fff; margin-bottom: 8px; }
        header p { color: #94a3b8; font-size: 14px; }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            padding: 8px 16px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 20px;
            width: fit-content;
            margin: 0 auto 20px;
        }

        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #a78bfa;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .status-text { font-size: 13px; color: #a78bfa; font-weight: 500; }

        .toolbar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #2a3548;
            color: #e2e8f0;
        }

        .btn:hover { background: rgba(30, 41, 59, 1); border-color: #3b82f6; }

        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }

        .btn-outline {
            background: transparent;
        }

        .btn-outline:hover { border-color: #3b82f6; color: #60a5fa; }

        .quotes-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .quote-card {
            background: #111827;
            border: 1px solid #1e2532;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .quote-card.demo { border-color: rgba(139, 92, 246, 0.3); }
        .quote-card.real { border-color: rgba(34, 197, 94, 0.3); }

        .card-header {
            padding: 18px 22px;
            border-bottom: 1px solid #1e2532;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title { display: flex; align-items: center; gap: 10px; }

        .card-icon {
            width: 36px; height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: rgba(59, 130, 246, 0.2);
        }

        .quote-card.demo .card-icon {
            background: rgba(139, 92, 246, 0.2);
        }

        .quote-card.real .card-icon {
            background: rgba(34, 197, 94, 0.2);
        }

        .card-info h2 { font-size: 17px; color: #fff; margin-bottom: 2px; }
        .card-info span { font-size: 12px; color: #94a3b8; }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .quote-card.demo .badge {
            background: rgba(139, 92, 246, 0.2);
            color: #a78bfa;
        }

        .quote-card.real .badge {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .card-body { padding: 18px 22px; display: flex; flex-direction: column; gap: 12px; }

        .price-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }

        .price { font-size: 30px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }

        .change {
            font-size: 15px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .change.up { color: #22c55e; }
        .change.down { color: #ef4444; }
        .change.neutral { color: #94a3b8; }

        .change::before { content: attr(data-sign); }

        .detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #64748b;
            border-top: 1px solid #1e2532;
            padding-top: 10px;
        }

        .detail { display: flex; align-items: center; gap: 6px; }

        .mode-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
        }

        .mode-demo { background: rgba(139, 92, 246, 0.2); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.3); }
        .mode-real { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.3); }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: rgba(15, 23, 42, 0.5);
            border-top: 1px solid #1e2532;
            font-size: 12px;
            color: #64748b;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #a78bfa;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .last-update { text-align: center; font-size: 12px; color: #64748b; margin-top: 16px; }

        .skeleton {
            height: 30px;
            background: linear-gradient(90deg, #1e2532 25%, #2a3548 50%, #1e2532 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .notice {
            text-align: center;
            padding: 16px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 12px;
            margin-bottom: 20px;
            color: #a78bfa;
            font-size: 13px;
        }

        .notice b { color: #c4b5fd; }

        @media (max-width: 640px) {
            .quotes-container { grid-template-columns: 1fr; }
            .price { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Dashboard de Cotações</h1>
            <p>Preços em tempo real para traders e investidores</p>
        </header>

        <div class="notice">
            💡 <b>Modo demo (offline):</b> os preços simulam variação real. Para cotações reais, hospede este arquivo num servidor web e ative o modo API abaixo.
        </div>

        <div class="status-bar">
            <div class="status-dot"></div>
            <span class="status-text" id="statusText">● Modo demo</span>
        </div>

        <div class="toolbar">
            <button class="btn btn-primary" id="btnRefresh" onclick="loadPrices()">
                🔄 Atualizar agora
            </button>
            <button class="btn btn-outline" id="btnDebug" onclick="toggleDebug()">🐛 Debug</button>
        </div>

        <div class="quotes-container" id="quotesContainer">
        </div>

        <div class="info-bar">
            <div class="live-indicator" id="liveIndicator">
                <div class="live-dot"></div>
                <span id="modeText">Demo</span>
            </div>
            <span id="modeBadge" class="mode-badge mode-demo">DEMO</span>
        </div>

        <div class="last-update" id="lastUpdate">Aguardando dados...</div>
    </div>

    <div class="debug" id="debugPanel">
        <div id="debugLog"></div>
    </div>

    <script>
        const BASE_PRICES = {
            usdbrl: { price: 5.2340 },
            eurbrl: { price: 5.6780 },
            btcbrl: { price: 342150.00 },
            ibovespa: { price: 124580.50 },
            ewz: { price: 34.85 },
            sp500: { price: 5245.30 },
            nasdaq: { price: 16450.20 },
            dow: { price: 38950.10 }
        };

        const ASSETS = [
            { id: 'usdbrl', name: 'Dólar', symbol: 'USD-BRL', icon: '💵', market: 'Câmbio' },
            { id: 'eurbrl', name: 'Euro', symbol: 'EUR-BRL', icon: '🇪🇺', market: 'Câmbio' },
            { id: 'btcbrl', name: 'Bitcoin', symbol: 'BTC-BRL', icon: '₿', market: 'Cripto' },
            { id: 'ibovespa', name: 'Ibovespa', symbol: '^BVSP', icon: '🇧🇷', market: 'B3' },
            { id: 'ewz', name: 'EWZ', symbol: 'EWZ', icon: '🇺🇸', market: 'NYSE' },
            { id: 'sp500', name: 'S&P 500', symbol: '^GSPC', icon: '🇺🇸', market: 'EUA' },
            { id: 'nasdaq', name: 'NASDAQ', symbol: '^IXIC', icon: '🇺🇸', market: 'EUA' },
            { id: 'dow', name: 'Dow Jones', symbol: '^DJI', icon: '🇺🇸', market: 'EUA' }
        ];

        let debugEnabled = false;
        let realMode = false;

        const container = document.getElementById('quotesContainer');
        const statusText = document.getElementById('statusText');
        const lastUpdate = document.getElementById('lastUpdate');
        const btnRefresh = document.getElementById('btnRefresh');
        const btnDebug = document.getElementById('btnDebug');
        const modeText = document.getElementById('modeText');
        const modeBadge = document.getElementById('modeBadge');
        const debugPanel = document.getElementById('debugPanel');
        const debugLog = document.getElementById('debugLog');

        function debug(msg, type = 'info') {
            console.log(`[Dashboard] ${msg}`);
            if (!debugEnabled) return;
            const entry = document.createElement('div');
            entry.className = `debug-entry ${type === 'error' ? 'debug-error' : type === 'ok' ? 'debug-ok' : ''}`;
            entry.textContent = `[${new Date().toLocaleTimeString('pt-BR')}] ${msg}`;
            debugLog.prepend(entry);
            debugPanel.classList.add('show');
        }

        function toggleDebug() {
            debugEnabled = !debugEnabled;
            debugPanel.classList.toggle('show');
            btnDebug.textContent = debugEnabled ? '🐛 Debug ON' : '🐛 Debug';
        }

        ASSETS.forEach(a => {
            const card = document.createElement('div');
            card.className = 'quote-card demo';
            card.id = `card-${a.id}`;
            card.innerHTML = `
                <div class="card-header">
                    <div class="card-title">
                        <div class="card-icon">${a.icon}</div>
                        <div class="card-info">
                            <h2>${a.name}</h2>
                            <span>${a.market}</span>
                        </div>
                    </div>
                    <span class="badge">${a.symbol}</span>
                </div>
                <div class="card-body">
                    <div class="price-row">
                        <div class="price skeleton" id="price-${a.id}">--</div>
                        <div class="change neutral skeleton" id="change-${a.id}" data-sign="+">--</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail"><span>Var. %</span><span id="pct-${a.id}">--</span></div>
                        <div class="detail"><span>Atualizado</span><span id="time-${a.id}">--</span></div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });

        function fmtMoney(v, decimals = 2) {
            return v.toLocaleString('pt-BR', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
        }

        function fmtPct(v) {
            const abs = Math.abs(v).toFixed(2);
            return v >= 0 ? `+${abs}%` : `-${abs}%`;
        }

        function setPrice(id, price, change, pct, real = false) {
            const card = document.getElementById(`card-${id}`);
            card.className = `quote-card ${real ? 'real' : 'demo'}`;
            const priceEl = document.getElementById(`price-${id}`);
            const changeEl = document.getElementById(`change-${id}`);
            const pctEl = document.getElementById(`pct-${id}`);
            const timeEl = document.getElementById(`time-${id}`);

            priceEl.textContent = fmtMoney(price);
            priceEl.className = 'price';
            const now = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            timeEl.textContent = now;

            changeEl.className = 'change';
            if (change > 0) {
                changeEl.classList.add('up');
                changeEl.setAttribute('data-sign', '+');
                changeEl.textContent = `+${fmtMoney(change, 2)}`;
                pctEl.textContent = `(${fmtPct(pct)})`;
                pctEl.className = 'up';
            } else if (change < 0) {
                changeEl.classList.add('down');
                changeEl.setAttribute('data-sign', '−');
                changeEl.textContent = `−${fmtMoney(Math.abs(change), 2)}`;
                pctEl.textContent = `(${fmtPct(pct)})`;
                pctEl.className = 'down';
            } else {
                changeEl.classList.add('neutral');
                changeEl.setAttribute('data-sign', '');
                changeEl.textContent = fmtMoney(0, 2);
                pctEl.textContent = '(0.00%)';
                pctEl.className = 'neutral';
            }
        }

        function simulatePrices() {
            for (const [id, base] of Object.entries(BASE_PRICES)) {
                const drift = (Math.random() - 0.5) * 0.02;
                const newPrice = base.price * (1 + drift);
                const change = newPrice - base.price;
                const pct = (change / base.price) * 100;
                setPrice(id, newPrice, change, pct, false);
                BASE_PRICES[id].price = newPrice;
            }
        }

        /* ============================================================
           CODIGO DE API REAL - descomentar quando hospedar no servidor
           ============================================================

        async function fetchJson(url, timeoutMs = 10000) {
            const ctrl = new AbortController();
            const to = setTimeout(() => ctrl.abort(), timeoutMs);
            const res = await fetch(url, {
                signal: ctrl.signal,
                headers: {
                    Accept: 'application/json',
                    'Cache-Control': 'no-cache',
                    'User-Agent': 'Mozilla/5.0'
                }
            });
            clearTimeout(to);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        }

        async function loadRealPrices() {
            // Frankfurter - câmbio
            const usd = await fetchJson('https://api.frankfurter.app/latest?from=USD&to=BRL');
            const eur = await fetchJson('https://api.frankfurter.app/latest?from=EUR&to=BRL');
            setPrice('usdbrl', usd.rates.BRL, 0, 0, true);
            setPrice('eurbrl', eur.rates.BRL, 0, 0, true);

            // CoinGecko - Bitcoin
            const btc = await fetchJson('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=brl&include_24h_change=true');
            setPrice('btcbrl', btc.bitcoin.brl, 0, btc.bitcoin.brl_24h_change || 0, true);

            // Stooq - indices (CSV)
            const csv = await fetch('https://stooq.com/q/l/?s=^BVSP,EWZ,^GSPC,^IXIC,^DJI&f=sd2t2ohlcv&h&e=csv').then(r => r.text());
            const lines = csv.trim().split('\n');
            const header = lines[0].split(',').map(h => h.trim().toLowerCase());
            const map = { '^BVSP': 'ibovespa', 'EWZ': 'ewz', '^GSPC': 'sp500', '^IXIC': 'nasdaq', '^DJI': 'dow' };
            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(',').map(c => c.trim());
                if (cols.length < header.length) continue;
                const row = {};
                header.forEach((h, idx) => { row[h] = cols[idx]; });
                const symbol = row['symbol'] || row['tick'];
                const close = parseFloat(row['close']);
                const open = parseFloat(row['open']);
                const change = close - open;
                const pct = (change / open) * 100;
                if (map[symbol]) setPrice(map[symbol], close, change, pct, true);
            }
        }
        ============================================================ */

        async function loadPrices() {
            btnRefresh.disabled = true;
            btnRefresh.textContent = '⏳ Atualizando...';
            statusText.textContent = 'Carregando...';
            lastUpdate.textContent = 'Atualizando...';

            if (realMode) {
                try {
                    // await loadRealPrices(); // descomentar no servidor
                    statusText.textContent = 'Tempo real (API)';
                } catch (e) {
                    debug('API falhou: ' + e.message, 'error');
                    simulatePrices();
                    statusText.textContent = 'API falhou, modo demo';
                }
            } else {
                simulatePrices();
                statusText.textContent = 'Modo demo';
            }

            modeText.textContent = realMode ? 'Tempo real' : 'Demo';
            modeBadge.textContent = realMode ? 'TEMPO REAL' : 'DEMO';
            modeBadge.className = 'mode-badge ' + (realMode ? 'mode-real' : 'mode-demo');
            lastUpdate.textContent = 'Última atualização: ' + new Date().toLocaleString('pt-BR');

            btnRefresh.disabled = false;
            btnRefresh.textContent = '🔄 Atualizar agora';
        }

        loadPrices();
        setInterval(loadPrices, 30000);
    </script>
</body>
</html>
